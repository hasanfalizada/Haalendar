# +++===+++ 2026-10-14 — Hasan Alizada — HAAL-006. GitHub issue form for feature requests.
name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from the user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Calendar
        - To-Do
        - Kanban
        - Cross-module / integration
        - Accounts / admin
        - Offline / sync
        - Installation / deployment
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
