# +++===+++ 2026-10-14 — Hasan Alizada — HAAL-015. Shared OpenAPI components: base types, RFC 9457 problems, cursor pagination, concurrency and idempotency headers.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-haalendar_session
      description: Opaque server-side session (ADR-0005). HttpOnly, Secure, SameSite=Lax.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on every unsafe method (POST, PUT, PATCH, DELETE) together with the session cookie.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor` of the previous page.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current `version` of the resource as a strong ETag, e.g. `"7"`. Missing → 428, stale → 412.
      schema: { type: string, pattern: '^"\d+"$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID. A repeated request with the same key and body returns the original response; same key with a different body → 422 `idempotency_key_reused`. Keys are kept 24 h.
      schema: { $ref: '#/components/schemas/Uuid' }
    IncludeDeleted:
      name: include_deleted
      in: query
      schema: { type: boolean, default: false }

  headers:
    ETag:
      description: Strong ETag equal to the resource `version`.
      schema: { type: string }
    RateLimit:
      description: Remaining quota and reset (IETF RateLimit header fields).
      schema: { type: string }

  responses:
    Deleted:
      description: Soft-deleted. Returns the delete batch id usable for restore (FR-X-01, FR-X-04).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DeleteResult' }
    NoContent:
      description: Done, no body.
    BadRequest:
      description: Malformed request.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Not authenticated or session expired (`session_expired`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Authenticated but not allowed (`forbidden`, `csrf_failed`, `reauth_required`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource does not exist or is not visible to the user (no existence leak).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: State conflict (`duplicate`, `invalid_state`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionFailed:
      description: '`If-Match` does not match the current version (`version_conflict`); body contains the current resource in `current`.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionRequired:
      description: '`If-Match` header missing.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PayloadTooLarge:
      description: Body or file exceeds the limit (`payload_too_large`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UnsupportedMediaType:
      description: Content type not accepted (`unsupported_media_type`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationFailed:
      description: Body is well-formed but invalid (`validation_failed`); see `errors`.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Rate limit or temporary account lock (`rate_limited`, `account_locked`).
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait. }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 (time-ordered); may be generated by the client for offline creation.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Date:
      type: string
      format: date
    LocalTime:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: Wall-clock time HH:MM.
    TimeZone:
      type: string
      description: IANA time zone, e.g. Europe/Berlin.
      maxLength: 64
    Color:
      type: string
      enum: [red, orange, yellow, green, blue, purple, brown, black]
    Priority:
      type: string
      enum: [low, medium, high]
      default: medium
    Permission:
      type: string
      enum: [view, edit]
    ContainerKind:
      type: string
      enum: [calendar, board, note]
    ItemKind:
      type: string
      enum: [event, note, card]
    Position:
      type: string
      description: Fractional index; lexicographic order (ADR domain model P6).
      maxLength: 64
    Markdown:
      type: string
      maxLength: 100000
      description: CommonMark; rendered sanitised (FR-X-20).

    Meta:
      type: object
      description: Common read-only fields of every resource.
      required: [created_at, updated_at, version]
      properties:
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        created_by: { $ref: '#/components/schemas/Uuid' }
        updated_by: { $ref: '#/components/schemas/Uuid' }
        deleted_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        delete_batch_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        version: { type: integer, minimum: 1, description: Optimistic concurrency counter; also the ETag. }

    DeleteResult:
      type: object
      required: [id, deleted_at, delete_batch_id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        deleted_at: { $ref: '#/components/schemas/Timestamp' }
        delete_batch_id: { $ref: '#/components/schemas/Uuid' }

    PageInfo:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          oneOf: [{ type: string }, { type: 'null' }]
          description: null on the last page.

    Problem:
      type: object
      description: RFC 9457 Problem Details. `type` is a relative URI resolved against the instance, documenting the problem at /problems/{code}.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, example: /problems/version_conflict }
        title: { type: string, example: The resource was changed by someone else }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: Stable machine-readable code.
          enum:
            - bad_request
            - session_expired
            - invalid_credentials
            - account_locked
            - email_not_verified
            - reauth_required
            - password_change_required
            - totp_required
            - csrf_failed
            - forbidden
            - not_found
            - duplicate
            - invalid_state
            - version_conflict
            - precondition_required
            - idempotency_key_reused
            - validation_failed
            - payload_too_large
            - unsupported_media_type
            - rate_limited
            - requires_connection
            - cursor_invalid
            - internal_error
        request_id: { type: string, description: Correlation id for logs. }
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer: { type: string, description: 'JSON Pointer (RFC 6901) into the request body, e.g. /end_date.' }
              detail: { type: string }
              code: { type: string }
        current:
          type: object
          description: Current server representation on `version_conflict`.
