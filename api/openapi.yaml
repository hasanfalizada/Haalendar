# +++===+++ 2026-10-14 — Hasan Alizada — HAAL-015. Root of the Haalendar HTTP API contract (contract-first). Modules live in api/modules/*.yaml; shared components in api/components/common.yaml. The implementation must conform (contract tests in CI).
openapi: 3.1.1
info:
  title: Haalendar API
  version: 1.0.0-draft
  summary: Calendar, To-Do and Kanban — self-hosted, multi-user, offline-first.
  description: |
    Conventions (see api/README.md):
    - JSON with snake_case fields; IDs are UUIDv7 and may be generated by clients (offline creation).
    - Errors: RFC 9457 `application/problem+json` with a stable `code`.
    - Updates: `PATCH` with `application/merge-patch+json` (RFC 7396) and `If-Match: "<version>"`.
    - Deletes are always soft; responses carry `delete_batch_id` for restore.
    - Lists: cursor pagination (`cursor`, `limit`, `next_cursor`).
    - Unsafe requests: session cookie + `X-CSRF-Token`; optional `Idempotency-Key`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
    description: Same origin as the web app
security:
  - sessionCookie: []
    csrfToken: []
tags:
  - { name: setup, description: First-run wizard }
  - { name: auth, description: 'Login, registration, password reset, re-authentication, OIDC' }
  - { name: account, description: 'Current user, settings, sessions, 2FA, push' }
  - { name: admin, description: Account administration (no content access) }
  - { name: calendar, description: 'Calendars, events, occurrences' }
  - { name: todo, description: Notes }
  - { name: kanban, description: 'Boards, columns, cards' }
  - { name: items, description: 'Sub-resources shared by events, notes and cards' }
  - { name: sharing, description: Container shares }
  - { name: search, description: Full-text search }
  - { name: trash, description: Soft-deleted data }
  - { name: export, description: Data export }
  - { name: notifications, description: In-app notification center }
  - { name: bulk, description: Multi-select operations }
  - { name: sync, description: Offline sync and live updates (provisional) }
  - { name: system, description: Health and demo }

