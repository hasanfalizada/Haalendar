# +++===+++ 2026-10-14 — Hasan Alizada — HAAL-016. Alembic configuration. The database URL is NOT stored here;
# migrations/env.py reads it from HAALENDAR_DATABASE_URL (or HAALENDAR_DATABASE_URL_FILE). Migrations are forward-only.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/src
path_separator = os
timezone = UTC
