# +++===+++ 2026-10-14 — Hasan Alizada — HAAL-016. Backend package: FastAPI + SQLAlchemy 2.1 (async, psycopg 3) + Alembic, structlog JSON logging. Versions pinned per ADR-0003 (verified 2026-10-14).
[project]
name = "haalendar-backend"
version = "0.1.0"
description = "Haalendar backend: HTTP API, workers and migrations"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.143.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "sqlalchemy[asyncio]==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "uvicorn[standard]==0.54.0",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "pyotp==2.10.0",
  "cryptography==50.0.2",
  # +++===+++ 2026-10-15 — Hasan Alizada — HAAL-166. Avatar re-encoding (metadata stripping) and content-addressed storage (ADR-0004).
  "pillow==13.0.0",
  "blake3==1.0.10",
  # +++===+++ 2026-10-15 — Hasan Alizada — HAAL-169. Pinned IANA time zone database (same rules on every host).
  "tzdata==2026.5",
  # +++===+++ 2026-10-18 — Hasan Alizada — HAAL-043. Background jobs on PostgreSQL (ADR-0003): data export archives.
  "procrastinate==3.10.0",
  # +++===+++ 2026-10-22 — Hasan Alizada — HAAL-055. Server-Sent Events for live updates (ADR-0003, ADR-0009).
  "sse-starlette==3.5.0",
  # +++===+++ 2026-10-29 — Hasan Alizada — HAAL-095. iCalendar (RFC 5545) import and export (BSD-2-Clause, D-83).
  "icalendar==7.3.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx2==2.13.1",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  # +++===+++ 2026-10-18 — Hasan Alizada — HAAL-043. Tests validate export archives against the published JSON Schema.
  "jsonschema==4.26.0",
  "types-jsonschema==4.26.0.20261006",
]

[project.scripts]
haalendar-api = "haalendar.main:run"
haalendar-db-bootstrap = "haalendar.dbroles:main"
haalendar-worker = "haalendar.jobs:run_worker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haalendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["db: needs PostgreSQL via HAALENDAR_TEST_DATABASE_URL (skipped otherwise)"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "BLE", "SIM", "RUF"]
# E501: line length is enforced by `ruff format`; long marker comments are allowed (ruff docs recommendation).
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use fake credentials on purpose to prove they never reach logs or responses.
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
