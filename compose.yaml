# +++===+++ 2026-11-01 — Hasan Alizada — HAAL-150. Haalendar on Docker Compose (ADR-0004). Copy .env.production.example
# to .env, fill it in, then:
#   docker compose up -d                    the app on http://127.0.0.1:8080 behind your own reverse proxy (HTTPS)
#   docker compose --profile proxy up -d    the same with the bundled Caddy: automatic HTTPS on ports 80/443
# Services: db (PostgreSQL 18, never published), migrate (database role and migrations, then exits), app (API, live
# stream, web app), worker (reminders, exports), proxy (Caddy, profile "proxy"). Data: volumes pgdata (database) and
# data (uploaded files, exports). Upgrade: back up, set HAALENDAR_IMAGE to the new tag, `docker compose up -d`
# (migrate runs first). Guide: docs/operations/deployment.md.
name: haalendar

x-haalendar: &haalendar
  image: ${HAALENDAR_IMAGE:-ghcr.io/hasanfalizada/haalendar:latest}
  env_file: .env
  environment: &haalendar-environment
    # The application role (row-level security, no DELETE) and the owner role for migrations; passwords from .env.
    HAALENDAR_DATABASE_URL: postgresql+psycopg://haalendar_app:${HAALENDAR_APP_DB_PASSWORD:?set HAALENDAR_APP_DB_PASSWORD in .env}@db:5432/haalendar
    HAALENDAR_MIGRATION_DATABASE_URL: postgresql+psycopg://haalendar:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/haalendar
    # X-Forwarded-* only from the web network (the bundled Caddy, or a proxy on this host through its gateway).
    HAALENDAR_FORWARDED_ALLOW_IPS: ${HAALENDAR_WEB_SUBNET:-172.30.250.0/24}
  # Read-only root filesystem: writable only /data (volume) and /tmp; no capabilities, no privilege escalation.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - data:/data

services:
  db:
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    environment:
      POSTGRES_USER: haalendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: haalendar
    # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker (ADR-0004 §4): mount the parent.
    volumes:
      - pgdata:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haalendar -d haalendar"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *haalendar
    command: ["migrate"]
    restart: "no"
    networks:
      - db
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *haalendar
    command: ["api"]
    restart: unless-stopped
    networks:
      - db
      - web
    ports:
      - "${HAALENDAR_HTTP_BIND:-127.0.0.1}:${HAALENDAR_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=4)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *haalendar
    command: ["worker"]
    restart: unless-stopped
    # Its own network for mail and Web Push; nothing is published.
    networks:
      - db
      - web
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/entrypoint.sh", "check-worker"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  proxy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      HAALENDAR_DOMAIN: ${HAALENDAR_DOMAIN:?set HAALENDAR_DOMAIN in .env (the host of HAALENDAR_PUBLIC_URL)}
    ports:
      - "${HAALENDAR_HTTP_PUBLIC_PORT:-80}:80"
      - "${HAALENDAR_HTTPS_PORT:-443}:443"
      - "${HAALENDAR_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    depends_on:
      app:
        condition: service_healthy

networks:
  # Only the services that need the database; no way out of it.
  db:
    internal: true
  web:
    ipam:
      config:
        - subnet: ${HAALENDAR_WEB_SUBNET:-172.30.250.0/24}

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
