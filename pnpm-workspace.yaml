# +++===+++ 2026-10-14 — Hasan Alizada — HAAL-017. pnpm workspace (ADR-0003: uv + pnpm, no Pants). JS packages are members.
packages:
  - frontend
  # +++===+++ 2026-10-30 — Hasan Alizada — HAAL-140. End-to-end tests.
  - e2e

# Supply-chain protection (instructions Section K): never install a version published less than 7 days ago.
minimumReleaseAge: 10080

# Install scripts are blocked by default; @scarf/scarf is install telemetry pulled in by Prism — never allowed to run.
allowBuilds:
  '@scarf/scarf': false

# Security fixes for transitive dev-tool dependencies (pnpm audit, HAAL-020). Remove when the parent packages update.
overrides:
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  # +++===+++ 2026-10-25 — Hasan Alizada — Dependency deadlines: zod (via @tanstack/router-plugin, GHSA-mrhx-c7xc-m3w5) and
  # undici (via jsdom, GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472); both fixes are older than 7 days.
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  "undici@>=8.0.0 <8.12.2": "8.12.2"
  # +++===+++ 2026-10-28 — Hasan Alizada — Dependency deadline: fast-uri via vite-plugin-pwa > workbox-build > ajv
  # (GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp); 3.1.9 is older than 7 days.
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  # +++===+++ 2026-10-29 — Hasan Alizada — Dependency deadline: seroval via @tanstack/react-router > router-core
  # (GHSA-f86p-h4j2-7qgj, GHSA-9wx9-5pv9-3349; in the client bundle); 1.6.12 is older than 7 days.
  "seroval@>=1.5.5 <1.6.11": "1.6.12"
  # +++===+++ 2026-10-30 — Hasan Alizada — Dependency deadline: serialize-javascript via vite-plugin-pwa > workbox-build >
  # @rollup/plugin-terser (GHSA-m5mm-p8h7-m29v, build time only); 7.1.3 is older than 7 days. Its audit exception is gone.
  "serialize-javascript@>=7.0.0 <7.1.3": "7.1.3"
  # +++===+++ 2026-11-05 — Hasan Alizada — Dependency deadline: glob (GHSA-3g3m-2fjr-6pw4) via workbox-build and minimatch
  # (GHSA-g3hv-75wg-m249) via glob, ESLint and typescript-eslint, build and lint time only; glob 14.0.3 and minimatch
  # 11.0.3 are older than 7 days and keep the APIs these parents call (globSync, minimatch, Minimatch). ejs 7 has no
  # dependencies: it drops jake > filelist > minimatch 5 of rollup-plugin-off-main-thread, which only calls ejs.render.
  "glob@>=11.0.0 <14.0.2": "14.0.3"
  "minimatch@>=10.0.0 <11.0.1": "11.0.3"
  "ejs@>=3.0.0 <7.0.0": "7.0.2"

# +++===+++ 2026-10-25 — Hasan Alizada — Temporary pnpm audit exceptions whose fixes are younger than 7 days. Listed with
# reason and expiry in backend/audit-ignores.json (npm_ignores); backend/tests/test_audit_ignores.py keeps both in step.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
